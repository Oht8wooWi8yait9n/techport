name: Update NASA TechPort Catalog & Sitemap

on:
  schedule:
    # Run weekly on Sunday at 05:30 UTC
    - cron: '30 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  harvest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Harvest NASA TechPort API and generate mirror
        env:
          FORCE_REFRESH: "1"
        run: |
          python3 generate_techport_sitemap.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            DAYS_SINCE_COMMIT=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
            if [ "$DAYS_SINCE_COMMIT" -ge 45 ]; then
              echo "No sitemap changes, but last commit was ${DAYS_SINCE_COMMIT} days ago (>= 45d). Pushing empty keepalive commit."
              git commit --allow-empty -m "chore(ci): 45-day keepalive to prevent GitHub Actions 60-day schedule auto-disable [skip ci]"
              git push
            else
              echo "No changes detected. (last commit ${DAYS_SINCE_COMMIT}d ago)."
            fi
          else
            git commit -m "Automated NASA TechPort catalog and sitemap update [skip ci]"
            git push
          fi
